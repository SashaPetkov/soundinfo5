<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ggwave Sound Transfer with Handshake & ARQ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      background: #f4f6f8;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input, textarea, button, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #0066cc;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #log {
      background: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      padding: 15px;
      height: 250px;
      overflow-y: auto;
      border-radius: 4px;
      white-space: pre-wrap;
    }
    .status {
      font-weight: bold;
      padding: 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .status.connected { background: #e6ffed; color: #1a7f37; }
    .status.disconnected { background: #ffebe9; color: #cf222e; }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.2.0/ggwave.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <h1>Звуковая передача данных (ggwave + WPA2 Handshake)</h1>

  <div class="card">
    <label for="psk">Общий секретный ключ (PSK):</label>
    <input type="text" id="psk" value="SecretWiFiPassword123">
    <div id="statusIndicator" class="status disconnected">Статус: Нет рукопожатия</div>
  </div>

  <div class="card">
    <h3>Управление</h3>
    <button id="btnInitAudio">1. Включить Микрофон / Аудио</button>
    <button id="btnStartHandshake">2. Начать Handshake</button>
    
    <label for="message">Сообщение для передачи:</label>
    <textarea id="message" rows="3">Hello Audio World! Reliable delivery test.</textarea>
    <button id="btnSendData" disabled>3. Отправить пакеты</button>
  </div>

  <div class="card">
    <h3>Лог событий</h3>
    <div id="log"></div>
  </div>

<script>
const PKT_TYPE_HANDSHAKE_INIT = 0x01;
const PKT_TYPE_HANDSHAKE_RESP = 0x02;
const PKT_TYPE_HANDSHAKE_ACK  = 0x03;
const PKT_TYPE_DATA           = 0x04;

const CHUNK_SIZE = 10;

let ggwave = null;
let instance = null;
let context = null;
let mediaStream = null;
let recorder = null;

let isHandshakeDone = false;
let currentANonce = null;
let currentSNonce = null;

function log(msg) {
  const logDiv = document.getElementById('log');
  logDiv.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logDiv.scrollTop = logDiv.scrollHeight;
}

// Преобразование Uint8Array в бинарную строку (исправляет ошибку Cannot convert ... to int)
function uint8ToBinaryString(uint8Array) {
  let str = "";
  for (let i = 0; i < uint8Array.length; i++) {
    str += String.fromCharCode(uint8Array[i]);
  }
  return str;
}

function convertTypedArray(src, type) {
  var buffer = new ArrayBuffer(src.byteLength);
  new src.constructor(buffer).set(src);
  return new type(buffer);
}

// Звуковые ACK/NACK сигналы
async function playToneSignal(isSuccess) {
  if (!context) return;
  if (context.state === 'suspended') await context.resume();

  const osc = context.createOscillator();
  const gain = context.createGain();
  osc.connect(gain);
  gain.connect(context.destination);

  const now = context.currentTime;
  if (isSuccess) {
    // Успех (ACK): 880 Гц -> 1320 Гц
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1320, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else {
    // Ошибка (NACK): 300 Гц -> 150 Гц
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  }
}

function calcCRC8(dataArray) {
  let crc = 0x00;
  for (let byte of dataArray) {
    crc ^= byte;
    for (let i = 0; i < 8; i++) {
      if (crc & 0x80) crc = ((crc << 1) ^ 0x07) & 0xFF;
      else crc = (crc << 1) & 0xFF;
    }
  }
  return crc;
}

// Инициализация
document.getElementById('btnInitAudio').addEventListener('click', async () => {
  window.AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!context) {
    context = new AudioContext({sampleRate: 48000});
  }
  if (context.state === 'suspended') {
    await context.resume();
  }

  ggwave_factory().then((obj) => {
    ggwave = obj;
    const parameters = ggwave.getDefaultParameters();
    parameters.sampleRateInp = context.sampleRate;
    parameters.sampleRateOut = context.sampleRate;
    instance = ggwave.init(parameters);
    
    log("ggwave успешно инициализирован.");
    startCapturing();
  });
});

function startCapturing() {
  const constraints = { audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } };

  navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
    mediaStream = context.createMediaStreamSource(stream);
    recorder = context.createScriptProcessor(1024, 1, 1);

    recorder.onaudioprocess = (e) => {
      const inputData = e.inputBuffer.getChannelData(0);
      const res = ggwave.decode(instance, convertTypedArray(new Float32Array(inputData), Int8Array));

      if (res && res.length > 0) {
        handleIncomingPacket(new Uint8Array(res));
      }
    };

    mediaStream.connect(recorder);
    recorder.connect(context.destination);
    log("Микрофон слушает эфир...");
  }).catch((err) => log("Ошибка микрофона: " + err));
}

// Отправка пакетов в звуковой эфир
async function sendAudioPacket(uint8Data) {
  if (!ggwave || !instance) return;
  if (context.state === 'suspended') await context.resume();

  try {
    // ВАЖНО: Преобразуем Uint8Array в бинарную строку перед передачей в encode
    const binaryStrPayload = uint8ToBinaryString(uint8Data);

    const waveform = ggwave.encode(
      instance, 
      binaryStrPayload, 
      ggwave.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST, 
      10
    );

    const buf = convertTypedArray(waveform, Float32Array);
    const buffer = context.createBuffer(1, buf.length, context.sampleRate);
    buffer.getChannelData(0).set(buf);

    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(context.destination);
    source.start(0);

    log("Пакет отправлен в динамики.");
  } catch (err) {
    log("[ОШИБКА Воспроизведения]: " + err.message);
  }
}

// Обработка пакетов
function handleIncomingPacket(bytes) {
  if (bytes.length < 5) return;

  const type = bytes[0];
  const pktId = bytes[1];
  const totalPkts = bytes[2];
  const payloadLen = bytes[3];
  const payload = bytes.slice(4, 4 + payloadLen);
  const receivedCRC = bytes[4 + payloadLen];

  if (receivedCRC !== calcCRC8(bytes.slice(0, 4 + payloadLen))) {
    log(`[ОШИБКА] Поврежден пакет #${pktId} (ошибка CRC)`);
    playToneSignal(false); // Звук NACK
    return;
  }

  const psk = document.getElementById('psk').value;

  if (type === PKT_TYPE_HANDSHAKE_INIT) {
    currentANonce = CryptoJS.lib.WordArray.create(payload).toString();
    currentSNonce = CryptoJS.lib.WordArray.random(8).toString();
    const hmac = CryptoJS.HmacSHA256(currentANonce + currentSNonce, psk).toString();
    
    log("Получен INIT. Отправка RESP...");
    sendControlPacket(PKT_TYPE_HANDSHAKE_RESP, new TextEncoder().encode(currentSNonce + ":" + hmac.substring(0, 8)));
  } 
  else if (type === PKT_TYPE_HANDSHAKE_RESP) {
    const text = new TextDecoder().decode(payload);
    const [sNonce, hmacPart] = text.split(":");
    const expectedHmac = CryptoJS.HmacSHA256(currentANonce + sNonce, psk).toString().substring(0, 8);
    
    if (hmacPart === expectedHmac) {
      log("Handshake УСПЕШНО ЗАВЕРШЁН!");
      setHandshakeState(true);
      sendControlPacket(PKT_TYPE_HANDSHAKE_ACK, new Uint8Array([0x01]));
      playToneSignal(true); // Звук ACK
    } else {
      log("[ОШИБКА] Неверный PSK ключ!");
      playToneSignal(false); // Звук NACK
    }
  } 
  else if (type === PKT_TYPE_HANDSHAKE_ACK) {
    log("Защищенное соединение подтверждено.");
    setHandshakeState(true);
    playToneSignal(true); // Звук ACK
  } 
  else if (type === PKT_TYPE_DATA) {
    if (!isHandshakeDone) {
      log("[ОТКЛОНЕНО] Пакет без Handshake!");
      playToneSignal(false);
      return;
    }
    log(`[ПРИНЯТО #${pktId}/${totalPkts}]: "${new TextDecoder().decode(payload)}"`);
    playToneSignal(true); // Звук ACK
  }
}

function sendControlPacket(type, payloadUint8) {
  const header = [type, 0, 1, payloadUint8.length];
  const packetWithoutCRC = [...header, ...payloadUint8];
  const crc = calcCRC8(packetWithoutCRC);
  sendAudioPacket(new Uint8Array([...packetWithoutCRC, crc]));
}

function setHandshakeState(done) {
  isHandshakeDone = done;
  const ind = document.getElementById('statusIndicator');
  ind.className = done ? "status connected" : "status disconnected";
  ind.textContent = done ? "Статус: Защищенное соединение установлено" : "Статус: Нет рукопожатия";
  document.getElementById('btnSendData').disabled = !done;
}

document.getElementById('btnStartHandshake').addEventListener('click', () => {
  currentANonce = CryptoJS.lib.WordArray.random(8).toString();
  log("Запуск Handshake...");
  sendControlPacket(PKT_TYPE_HANDSHAKE_INIT, new TextEncoder().encode(currentANonce));
});

document.getElementById('btnSendData').addEventListener('click', async () => {
  const text = document.getElementById('message').value;
  const dataBytes = new TextEncoder().encode(text);
  const totalPackets = Math.ceil(dataBytes.length / CHUNK_SIZE);

  for (let i = 0; i < totalPackets; i++) {
    const chunk = dataBytes.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
    const header = [PKT_TYPE_DATA, i + 1, totalPackets, chunk.length];
    const packetWithoutCRC = [...header, ...chunk];
    const crc = calcCRC8(packetWithoutCRC);

    log(`Отправка пакета ${i + 1}/${totalPackets}...`);
    await sendAudioPacket(new Uint8Array([...packetWithoutCRC, crc]));
    await new Promise(r => setTimeout(r, 2000));
  }
});
</script>
</body>
</html>
