<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ggwave Sound Transfer with Handshake & ARQ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      background: #f4f6f8;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input, textarea, button, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #0066cc;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0052a3; }
    #log {
      background: #1e1e1e;
      color: #00ff66;
      font-family: monospace;
      padding: 15px;
      height: 250px;
      overflow-y: auto;
      border-radius: 4px;
      white-space: pre-wrap;
    }
    .status {
      font-weight: bold;
      padding: 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .status.connected { background: #e6ffed; color: #1a7f37; }
    .status.disconnected { background: #ffebe9; color: #cf222e; }
  </style>
  
  <!-- Загружаем библиотеки ggwave и CryptoJS -->
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.2.0/ggwave.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <h1>Звуковая передача данных (ggwave + WPA2-like Handshake)</h1>

  <div class="card">
    <label for="role">Режим устройства:</label>
    <select id="role">
      <option value="sender">Передатчик (Sender)</option>
      <option value="receiver">Приёмник (Receiver)</option>
    </select>

    <label for="psk">Общий секретный ключ (PSK / Пароль):</label>
    <input type="text" id="psk" value="SecretWiFiPassword123">

    <div id="statusIndicator" class="status disconnected">Статус: Нет рукопожатия</div>
  </div>

  <div class="card">
    <h3>Управление</h3>
    <button id="btnInitAudio">1. Инициализировать аудио</button>
    <button id="btnStartHandshake">2. Начать Handshake (Аудио)</button>
    
    <label for="message">Сообщение для передачи:</label>
    <textarea id="message" rows="3">Hello Audio World! 100% Reliable Delivery.</textarea>
    <button id="btnSendData" disabled>3. Отправить данные по пакетам</button>
  </div>

  <div class="card">
    <h3>Консоль событий</h3>
    <div id="log"></div>
  </div>

<script>
// --- КОНСТАНТЫ ПРОТОКОЛА ---
const PKT_TYPE_HANDSHAKE_INIT = 0x01;
const PKT_TYPE_HANDSHAKE_RESP = 0x02;
const PKT_TYPE_HANDSHAKE_ACK  = 0x03;
const PKT_TYPE_DATA           = 0x04;
const PKT_TYPE_ACK            = 0x05;

const CHUNK_SIZE = 10; // Размер нагрузки в 1 пакете (байты)

let ggwaveInstance = null;
let audioCtx = null;
let micStream = null;
let isListening = false;

// Состояние Handshake и ARQ
let sessionKey = null;
let isHandshakeDone = false;
let currentANonce = null;
let currentSNonce = null;

// Вспомогательное логирование
function log(msg) {
  const logDiv = document.getElementById('log');
  logDiv.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logDiv.scrollTop = logDiv.scrollHeight;
}

// --- СИГНАЛЫ УСПЕХА И ОШИБКИ (ACK / NACK TONES) ---
function playToneSignal(isSuccess) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (isSuccess) {
    // Успех: Двухтональный высокий сигнал (880 Гц -> 1320 Гц)
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1320, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else {
    // Ошибка/Потеря: Низкий нисходящий пилообразный сигнал (300 Гц -> 150 Гц)
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  }
}

// --- CRC8 ДЛЯ ПРОВЕРКИ ЦЕЛОСТНОСТИ ПАКЕТА ---
function calcCRC8(dataArray) {
  let crc = 0x00;
  for (let byte of dataArray) {
    crc ^= byte;
    for (let i = 0; i < 8; i++) {
      if (crc & 0x80) crc = ((crc << 1) ^ 0x07) & 0xFF;
      else crc = (crc << 1) & 0xFF;
    }
  }
  return crc;
}

// --- ИНИЦИАЛИЗАУЦИЯ GGWAVE & WEBAUDIO ---
document.getElementById('btnInitAudio').addEventListener('click', async () => {
  window.AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  ggwave_factory().then((ggwave) => {
    ggwaveInstance = ggwave;
    log("ggwave.js успешно инициализирован.");
    startListening();
  });
});

// --- СЛУШАТЕЛЬ МИКРОФОНА И ДЕКОДЕР ---
async function startListening() {
  if (isListening) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(micStream);
    const processor = audioCtx.createScriptProcessor(1024, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!ggwaveInstance) return;
      const inputData = e.inputBuffer.getChannelData(0);
      
      // Преобразование Float32 в Int16 для ggwave
      const buf = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        buf[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
      }

      const res = ggwaveInstance.decode(buf);
      if (res && res.length > 0) {
        handleIncomingPacket(new Uint8Array(res));
      }
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
    isListening = true;
    log("Микрофон подключен. Слушаем эфир...");
  } catch (err) {
    log("Ошибка доступа к микрофону: " + err);
  }
}

// --- ОТПРАВКА БАЙТОВ ЧЕРЕЗ GGWAVE ---
function sendAudioPacket(uint8Data) {
  if (!ggwaveInstance || !audioCtx) return;

  // Используем быстрый протокол Fast (ID 1 в ggwave)
  const waveform = ggwaveInstance.encode(uint8Data, 1, 100); 
  const buf = audioCtx.createBuffer(1, waveform.length, audioCtx.sampleRate);
  buf.getChannelData(0).set(waveform);

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start();
}

// --- ОБРАБОТЧИК ВХОДЯЩИХ ПАКЕТОВ ---
function handleIncomingPacket(bytes) {
  if (bytes.length < 5) return; // Минимальный размер пакета

  const type = bytes[0];
  const pktId = bytes[1];
  const totalPkts = bytes[2];
  const payloadLen = bytes[3];
  const payload = bytes.slice(4, 4 + payloadLen);
  const receivedCRC = bytes[4 + payloadLen];

  // Проверка CRC8
  const calculatedCRC = calcCRC8(bytes.slice(0, 4 + payloadLen));
  if (receivedCRC !== calculatedCRC) {
    log(`[ОШИБКА] Пакет #${pktId} поврежден (ошибка CRC).`);
    playToneSignal(false); // Низкий сигнал ошибки NACK
    return;
  }

  log(`[ВХОДЯЩИЙ] Тип: 0x${type.toString(16)}, PktID: ${pktId}/${totalPkts}`);

  const psk = document.getElementById('psk').value;

  // --- ОБРАБОТКА HANDSHAKE ---
  if (type === PKT_TYPE_HANDSHAKE_INIT) {
    currentANonce = CryptoJS.lib.WordArray.create(payload).toString();
    currentSNonce = CryptoJS.lib.WordArray.random(8).toString();
    
    // Включение в ответе HMAC(PSK, ANonce + SNonce)
    const hmac = CryptoJS.HmacSHA256(currentANonce + currentSNonce, psk).toString();
    
    log("Получен INIT. Отправка HANDSHAKE_RESP...");
    const respPayload = new TextEncoder().encode(currentSNonce + ":" + hmac.substring(0, 8));
    sendControlPacket(PKT_TYPE_HANDSHAKE_RESP, respPayload);
  } 
  else if (type === PKT_TYPE_HANDSHAKE_RESP) {
    const text = new TextDecoder().decode(payload);
    const [sNonce, hmacPart] = text.split(":");
    
    const expectedHmac = CryptoJS.HmacSHA256(currentANonce + sNonce, psk).toString().substring(0, 8);
    if (hmacPart === expectedHmac) {
      log("Handshake УСПЕШНО ЗАВЕРШЁН!");
      setHandshakeState(true);
      sendControlPacket(PKT_TYPE_HANDSHAKE_ACK, new Uint8Array([0x01]));
      playToneSignal(true);
    } else {
      log("[ОШИБКА HANDSHAKE] Неверный ключ PSK!");
      playToneSignal(false);
    }
  } 
  else if (type === PKT_TYPE_HANDSHAKE_ACK) {
    log("Получен ACK рукопожатия. Связь установлена.");
    setHandshakeState(true);
    playToneSignal(true);
  }
  // --- ОБРАБОТКА ДАННЫХ И ARQ ---
  else if (type === PKT_TYPE_DATA) {
    if (!isHandshakeDone) {
      log("[ОТКЛОНЕНО] Пакет данных получен до завершения Handshake!");
      playToneSignal(false);
      return;
    }

    log(`[УСПЕХ] Пакет #${pktId} успешно принят: "${new TextDecoder().decode(payload)}"`);
    playToneSignal(true); // Аудио подтверждение успеха приема
    
    // Отправляем ACK обратным аудио-пакетом (опционально)
    sendControlPacket(PKT_TYPE_ACK, new Uint8Array([pktId]));
  }
}

// --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ УПРАВЛЕНИЯ ПАКЕТАМИ ---
function sendControlPacket(type, payloadUint8) {
  const header = [type, 0, 1, payloadUint8.length];
  const packetWithoutCRC = [...header, ...payloadUint8];
  const crc = calcCRC8(packetWithoutCRC);
  const fullPacket = new Uint8Array([...packetWithoutCRC, crc]);
  
  sendAudioPacket(fullPacket);
}

function setHandshakeState(done) {
  isHandshakeDone = done;
  const ind = document.getElementById('statusIndicator');
  if (done) {
    ind.className = "status connected";
    ind.textContent = "Статус: Защищенное соединение установлено";
    document.getElementById('btnSendData').disabled = false;
  } else {
    ind.className = "status disconnected";
    ind.textContent = "Статус: Нет рукопожатия";
    document.getElementById('btnSendData').disabled = true;
  }
}

// --- ЗАПУСК HANDSHAKE ---
document.getElementById('btnStartHandshake').addEventListener('click', () => {
  currentANonce = CryptoJS.lib.WordArray.random(8).toString();
  log("Инициализация Handshake (отправка ANonce)...");
  sendControlPacket(PKT_TYPE_HANDSHAKE_INIT, new TextEncoder().encode(currentANonce));
});

// --- ПАКЕТИРОВАНИЕ И ОТПРАВКА ДАННЫХ (ARQ / STOP-AND-WAIT) ---
document.getElementById('btnSendData').addEventListener('click', async () => {
  const text = document.getElementById('message').value;
  const dataBytes = new TextEncoder().encode(text);
  
  const totalPackets = Math.ceil(dataBytes.length / CHUNK_SIZE);
  log(`Начало передачи: ${dataBytes.length} байт (${totalPackets} пакетов)...`);

  for (let i = 0; i < totalPackets; i++) {
    const start = i * CHUNK_SIZE;
    const chunk = dataBytes.slice(start, start + CHUNK_SIZE);
    
    const header = [PKT_TYPE_DATA, i + 1, totalPackets, chunk.length];
    const packetWithoutCRC = [...header, ...chunk];
    const crc = calcCRC8(packetWithoutCRC);
    const fullPacket = new Uint8Array([...packetWithoutCRC, crc]);

    log(`Отправка пакета ${i + 1}/${totalPackets}...`);
    sendAudioPacket(fullPacket);

    // Пауза 1.8с между пакетами, чтобы аудио-эфир успел освободиться
    await new Promise(resolve => setTimeout(resolve, 1800));
  }
  log("Передача всех пакетов завершена.");
});
</script>
</body>
</html>
